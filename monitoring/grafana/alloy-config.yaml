apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    // ========================================
    // KUBERNETES METRICS (cAdvisor + Kubelet)
    // ========================================
    discovery.kubernetes "nodes" {
      role = "node"
    }

    prometheus.scrape "cadvisor" {
      targets           = discovery.kubernetes.nodes.targets
      scheme            = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      metrics_path      = "/metrics/cadvisor"
      scrape_interval   = "30s"
      tls_config {
        insecure_skip_verify = true
      }
      clustering {
        enabled = true
      }
      forward_to = [prometheus.relabel.cadvisor.receiver]
    }

    prometheus.relabel "cadvisor" {
      forward_to = [prometheus.remote_write.default.receiver]
      rule {
        target_label = "job"
        replacement  = "cadvisor"
      }
    }

    prometheus.scrape "kubelet" {
      targets           = discovery.kubernetes.nodes.targets
      scheme            = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      metrics_path      = "/metrics"
      scrape_interval   = "30s"
      tls_config {
        insecure_skip_verify = true
      }
      clustering {
        enabled = true
      }
      forward_to = [prometheus.relabel.kubelet.receiver]
    }

    prometheus.relabel "kubelet" {
      forward_to = [prometheus.remote_write.default.receiver]
      rule {
        target_label = "job"
        replacement  = "kubelet"
      }
    }

    // ========================================
    // NODE METRICS
    // ========================================
    prometheus.exporter.unix "node" {
      procfs_path = "/host/proc"
      sysfs_path  = "/host/sys"
      rootfs_path = "/host/root"

      enable_collectors = [
        "cpu", "meminfo", "diskstats", "filesystem", "netdev",
        "loadavg", "stat", "time", "uname", "vmstat", "pressure",
      ]

      filesystem {
        mount_points_exclude = "^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+|run/k3s/.+)($|/)"
      }
    }

    prometheus.scrape "node" {
      targets         = prometheus.exporter.unix.node.targets
      scrape_interval = "30s"
      forward_to      = [prometheus.relabel.node.receiver]
    }

    prometheus.relabel "node" {
      forward_to = [prometheus.remote_write.default.receiver]
      rule {
        target_label = "job"
        replacement  = "node-exporter"
      }
      rule {
        source_labels = ["__host__"]
        target_label  = "instance"
      }
    }

    // ========================================
    // PROMETHEUS REMOTE WRITE
    // ========================================
    prometheus.remote_write "default" {
      endpoint {
        url = "http://prometheus-service-internal.monitoring.svc.cluster.local:9090/api/v1/write"
      }
    }

    // ========================================
    // LOGS COLLECTION
    // ========================================
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods_filtered" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "keel"
        action        = "drop"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        regex         = "keel-.*"
        action        = "drop"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "job"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods_filtered.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki-service-internal.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
